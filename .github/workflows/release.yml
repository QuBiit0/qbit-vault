name: release

# Runs on a pushed version tag (v0.1.0, v0.1.0-beta.1). It tests, builds the
# archives with GoReleaser, creates the GitHub release as a draft with
# checksums.txt, and attests the build provenance of every archive. The sign
# job then signs checksums.txt with Minisign and only then publishes the
# release; the server image is built after that.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Logs go outside the checkout: GoReleaser refuses a dirty work tree.
      # QBIT_VAULT_RELEASE_CHECK makes the tests fail while the pinned release
      # key is still the test key, so such a release cannot be built.
      - name: test
        env:
          QBIT_VAULT_RELEASE_CHECK: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          set -o pipefail
          go test -count=1 -timeout 30m ./... 2>&1 | tee "$RUNNER_TEMP/ci-logs/go-test.log"
      - name: leak grep
        run: go run ./tools/leakgrep "$RUNNER_TEMP/ci-logs"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Signs checksums.txt of the draft release and publishes it. The job waits
  # for a reviewer of the release-signing environment, which also holds the
  # signing seed. It can only write release assets: no tokens for attestations
  # or packages. Any failing step leaves the release a draft.
  sign:
    needs: release
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write  # upload the signature to the draft and publish it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          while read -r _ name; do
            case "$name" in ""|*/*) echo "unexpected name in checksums.txt" >&2; exit 1;; esac
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" < /dev/null
          done < checksums.txt
      - name: check checksums
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum --check --strict checksums.txt
      - name: build signer
        run: go build -o "$RUNNER_TEMP/release-sign" ./tools/release-sign
      - name: sign
        env:
          QBIT_VAULT_SIGNING_KEY: ${{ secrets.QBIT_VAULT_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: '"$RUNNER_TEMP/release-sign" sign "$RUNNER_TEMP/release/checksums.txt" --version "$TAG"'
      - name: verify with the pinned key
        run: '"$RUNNER_TEMP/release-sign" verify "$RUNNER_TEMP/release/checksums.txt"'
      - name: upload signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/release/checksums.txt.minisig" --repo "$GITHUB_REPOSITORY"
      # Download the signature back and check it again, so what is published
      # is what was verified.
      - name: verify the upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uploaded"
          cd "$RUNNER_TEMP/uploaded"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --pattern checksums.txt.minisig
          cmp checksums.txt "$RUNNER_TEMP/release/checksums.txt"
          "$RUNNER_TEMP/release-sign" verify "$RUNNER_TEMP/uploaded/checksums.txt"
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The sync server image (docs/REMOTE_SYNC.md § 10). Runs after the release
  # is signed and published; it only needs to push to ghcr.io and read the code.
  server-image:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the tagged commit
      packages: write  # push ghcr.io/qbitdevz/qbit-vault-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/qbitdevz/qbit-vault-server:${{ github.ref_name }}
            ghcr.io/qbitdevz/qbit-vault-server:latest
