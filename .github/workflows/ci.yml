name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: |
          mkdir -p ci-logs
          flags=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then flags="-race"; fi
          set -o pipefail
          go test -v -count=1 $flags ./... 2>&1 | tee ci-logs/go-test.log
      - name: leak grep
        if: always()
        run: go run ./tools/leakgrep ci-logs
