# Secret-shaped input patterns for paste interception (R-CAP-06).
# Shared byte-for-byte between the Go core and gentle-vault-pi (parity test).
# `suggest` is the default name offered in the capture prompt.
format: gentle-vault-secret-patterns/1
patterns:
  - id: github_pat
    regex: '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,}\b'
    suggest: GITHUB_TOKEN
  - id: github_fine_grained
    regex: '\bgithub_pat_[A-Za-z0-9_]{80,}\b'
    suggest: GITHUB_TOKEN
  - id: openai
    regex: '\bsk-(proj-)?[A-Za-z0-9_-]{32,}\b'
    suggest: OPENAI_API_KEY
  - id: anthropic
    regex: '\bsk-ant-[A-Za-z0-9_-]{40,}\b'
    suggest: ANTHROPIC_API_KEY
  - id: aws_access_key
    regex: '\b(AKIA|ASIA)[0-9A-Z]{16}\b'
    suggest: AWS_ACCESS_KEY_ID
  - id: slack
    regex: '\bxox[abpors]-[0-9A-Za-z-]{10,}\b'
    suggest: SLACK_TOKEN
  - id: stripe
    regex: '\b(sk|rk)_(live|test)_[0-9a-zA-Z]{24,}\b'
    suggest: STRIPE_API_KEY
  - id: google_api
    regex: '\bAIza[0-9A-Za-z_-]{35}\b'
    suggest: GOOGLE_API_KEY
  - id: npm
    regex: '\bnpm_[A-Za-z0-9]{36}\b'
    suggest: NPM_TOKEN
  - id: vercel
    regex: '\bvercel_[A-Za-z0-9]{24,}\b'
    suggest: VERCEL_TOKEN
  - id: private_key_pem
    regex: '-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    suggest: PRIVATE_KEY
    multiline: true
  - id: jwt
    regex: '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    suggest: JWT_TOKEN
  - id: database_url
    regex: '\b(postgres|postgresql|mysql|mongodb(\+srv)?|redis|amqp)://[^:\s]+:[^@\s]+@[^\s]+'
    suggest: DATABASE_URL
  - id: generic_assignment_high_entropy
    # KEY=<32+ chars with ≥3.5 bits/char Shannon entropy>; entropy computed in code, regex is the pre-filter
    regex: '\b[A-Z][A-Z0-9_]{2,63}\s*[=:]\s*["'']?([A-Za-z0-9+/_=-]{32,})["'']?'
    suggest: '{KEY}'
    entropy_min: 3.5
