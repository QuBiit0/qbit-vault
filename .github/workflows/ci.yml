name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on the Intel pool: the arm64 pool rarely has capacity for
        # private repositories, and the code under test (kqueue, osascript,
        # the Keychain) is the same on both architectures.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: agent skill copies match
        if: matrix.os == 'ubuntu-latest'
        # One review skill for every agent: Codex and Pi read .agents/skills,
        # Claude Code reads .claude/skills.
        run: cmp .agents/skills/contribution-review/SKILL.md .claude/skills/contribution-review/SKILL.md
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: |
          mkdir -p ci-logs
          flags=""
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then flags="-race"; fi
          set -o pipefail
          go test -v -count=1 $flags ./... 2>&1 | tee ci-logs/go-test.log
      - name: leak grep
        if: always()
        run: go run ./tools/leakgrep ci-logs
      - name: install script
        if: matrix.os != 'windows-latest'
        run: bash scripts/install_test.sh
      - name: install script (PowerShell 7 and Windows PowerShell)
        if: matrix.os == 'windows-latest'
        run: |
          pwsh -NoProfile -File scripts/install_test.ps1
          env -u PSModulePath powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install_test.ps1

  # The matrix above builds with the Go version go.mod names. This job builds
  # with the latest stable Go, so a behavior change between versions (such as
  # encoding/json's handling of invalid UTF-8, which the redactor models) shows
  # up on the pull request instead of after a toolchain upgrade.
  test-stable-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: vet
        run: go vet ./...
      - name: test
        run: |
          mkdir -p ci-logs
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee ci-logs/go-test.log
      - name: leak grep
        if: always()
        run: go run ./tools/leakgrep ci-logs
