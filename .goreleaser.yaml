# Release build for qbit-vault (docs/INSTALL.md § One-line install).
# A `v*` tag runs .github/workflows/release.yml, which runs this file.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: qbit-vault

before:
  hooks:
    - go mod verify

builds:
  - id: qbit-vault
    main: ./cmd/qbit-vault
    binary: qbit-vault
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/qbitdevz/qbit-vault/internal/cli.Version={{ .Tag }}
      - -X github.com/qbitdevz/qbit-vault/internal/cli.Commit={{ .ShortCommit }}
  - id: qbit-vault-server
    main: ./cmd/qbit-vault-server
    binary: qbit-vault-server
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  # Names the install scripts rely on: qbit-vault_<os>_<arch>.tar.gz (.zip on
  # Windows). They carry no version so a script can build the name alone.
  - id: qbit-vault
    ids: [qbit-vault]
    name_template: "qbit-vault_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
  - id: qbit-vault-server
    ids: [qbit-vault-server]
    name_template: "qbit-vault-server_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The one-line installers are release assets too, so their SHA-256 is listed.
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# The release notes link the CHANGELOG section instead of listing commits.
changelog:
  disable: true

release:
  github:
    owner: qbitdevz
    name: qbit-vault
  # Regular releases, never pre-releases: releases/latest/download/install.sh
  # skips pre-releases, and the -beta in the version already says what it is.
  prerelease: "false"
  # Published as a draft: the sign job of release.yml adds
  # checksums.txt.minisig and only then makes the release public.
  draft: true
  # The installers are attached to every release (and listed in checksums.txt).
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1
  header: |
    What changed in {{ .Tag }}: see its section in [CHANGELOG.md](https://github.com/qbitdevz/qbit-vault/blob/{{ .Tag }}/CHANGELOG.md).
  footer: |
    ## Install

    Linux / macOS:

    ```bash
    curl -fsSL https://github.com/qbitdevz/qbit-vault/releases/latest/download/install.sh | sh
    ```

    Windows (PowerShell):

    ```powershell
    irm https://github.com/qbitdevz/qbit-vault/releases/latest/download/install.ps1 | iex
    ```

    With Go 1.26+: `go install github.com/qbitdevz/qbit-vault/cmd/qbit-vault@{{ .Tag }}`

    Then run `qbit-vault` (guided setup) or `qbit-vault init`. Verify an archive's provenance with `gh attestation verify <file> --repo qbitdevz/qbit-vault`.

    ## Verify

    checksums.txt is signed with Minisign. Download `checksums.txt` and `checksums.txt.minisig`, then:

    ```bash
    minisign -V -P RWQrm6ZYLnbuvsS0Px4nVFDMnfj6QG4sqbwDkmelqS9njb/q577zkLt8 -m checksums.txt -x checksums.txt.minisig
    sha256sum --check --ignore-missing checksums.txt
    ```
