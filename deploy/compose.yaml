# qbit-vault-server behind the Dokploy (Traefik) proxy, which terminates TLS
# on the public domain. Set QBV_SERVER_PUBLIC_URL to that https:// origin.
# Invite the first account:  docker compose exec server /qbit-vault-server invite
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: qbit-vault-server:local
    environment:
      QBV_SERVER_PUBLIC_URL: ${QBV_SERVER_PUBLIC_URL:?set the https:// origin clients use}
      # How many proxies are in front of the server (the client IP for rate
      # limits is the Nth X-Forwarded-For entry from the right). 1: Traefik
      # alone, or Cloudflare + Traefik where Traefik does not trust Cloudflare
      # (it then rewrites the header). 2: Cloudflare + Traefik with Cloudflare's
      # ranges in Traefik's forwardedHeaders.trustedIPs. 0: reached directly.
      QBV_SERVER_TRUST_PROXY: ${QBV_SERVER_TRUST_PROXY:-1}
      # Optional first invite for a server with no account yet (at least 24
      # characters, 12 of them different; ignored once an account exists; never logged). For hosts
      # where `exec ... invite` is not possible. Remove it after registering.
      QBV_SERVER_BOOTSTRAP_INVITE: ${QBV_SERVER_BOOTSTRAP_INVITE:-}
    volumes:
      - vault-data:/data
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/qbit-vault-server", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  vault-data:
