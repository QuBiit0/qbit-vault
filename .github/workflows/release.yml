name: release

# Runs on a pushed version tag (v0.1.0, v0.1.0-beta.1). It tests, builds the
# archives with GoReleaser, publishes the GitHub release with checksums.txt,
# and attests the build provenance of every archive.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: |
          mkdir -p ci-logs
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee ci-logs/go-test.log
      - name: leak grep
        run: go run ./tools/leakgrep ci-logs
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
