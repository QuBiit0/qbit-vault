name: release

# Runs on a pushed version tag (v0.1.0, v0.1.0-beta.1). It tests, builds the
# archives with GoReleaser, publishes the GitHub release with checksums.txt,
# and attests the build provenance of every archive.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # Logs go outside the checkout: GoReleaser refuses a dirty work tree.
      - name: test
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          set -o pipefail
          go test -count=1 -timeout 30m ./... 2>&1 | tee "$RUNNER_TEMP/ci-logs/go-test.log"
      - name: leak grep
        run: go run ./tools/leakgrep "$RUNNER_TEMP/ci-logs"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
