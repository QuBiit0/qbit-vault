name: release

# Runs on a pushed version tag (v0.1.0, v0.1.0-beta.1). It tests, builds the
# archives with GoReleaser, publishes the GitHub release with checksums.txt,
# and attests the build provenance of every archive.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload its assets
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Logs go outside the checkout: GoReleaser refuses a dirty work tree.
      - name: test
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          set -o pipefail
          go test -count=1 -timeout 30m ./... 2>&1 | tee "$RUNNER_TEMP/ci-logs/go-test.log"
      - name: leak grep
        run: go run ./tools/leakgrep "$RUNNER_TEMP/ci-logs"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # The sync server image (docs/REMOTE_SYNC.md § 10). Runs after the release
  # job passed its tests; it only needs to push to ghcr.io and read the code.
  server-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read   # check out the tagged commit
      packages: write  # push ghcr.io/qubiit0/qbit-vault-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/qubiit0/qbit-vault-server:${{ github.ref_name }}
            ghcr.io/qubiit0/qbit-vault-server:latest
